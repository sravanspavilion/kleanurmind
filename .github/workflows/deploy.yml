name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to production
        if: github.event.inputs.environment == 'production' || github.ref == 'refs/heads/main'
        run: |
          echo "Deploy to production - configure your deployment target here"
          echo "Options:"
          echo "  - Vercel: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }}"
          echo "  - Railway: railway up --detach"
          echo "  - AWS ECS: Use AWS CLI to update service"
          echo "  - Self-hosted: SSH to server and pull new image"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to staging
        if: github.event.inputs.environment == 'staging'
        run: |
          echo "Deploy to staging - configure your staging deployment target here"
          echo "Image: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.tags }}"

      - name: Run database migrations on deploy
        run: |
          echo "Run migrations against production database"
          echo "Command: npx prisma migrate deploy"
          echo "Use a separate migration step in your deployment pipeline"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Notify deployment
        if: always()
        run: |
          STATUS="${{ job.status }}"
          echo "Deployment $STATUS"
          # Add Slack/Discord/Email notification here